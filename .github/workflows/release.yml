# Ghosst — CI/CD: every push to main → test → auto-bump build number
# → build release APK → publish a GitHub Release (always marked "latest",
# fixed asset name so the download URL never changes)
# → open the forced-update gate in Appwrite (all older builds hard-block).
name: Release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create releases + push the version-bump commit

# One release build at a time — versions stay monotonic.
concurrency:
  group: release-apk
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.x'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Quality gate — a failing test stops the release (and the bump).
      - name: Run tests
        run: flutter test

      # version: 1.0.0+3 → 1.0.0+4 (x.y.z is bumped by hand, +N is CI's).
      # The [skip ci] tag stops this commit from triggering another build.
      - name: Bump build number
        run: |
          VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          BASE=${VER%%+*}
          BUILD=${VER##*+}
          if [ "$BASE" = "$VER" ]; then BUILD=0; fi
          NEW=$((BUILD + 1))
          sed -i "s/^version: .*/version: ${BASE}+${NEW}/" pubspec.yaml
          echo "APP_VERSION=${BASE}+${NEW}" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${BASE}+${NEW} [skip ci]"
          for i in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            if [ "$i" = "3" ]; then echo "push failed 3x" >&2; exit 1; fi
            git pull --rebase origin main
            sleep 5
          done
          echo "BUMP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Build release APK
        run: flutter build apk --release

      # Fixed name → stable download URL: .../releases/latest/download/Ghosst.apk
      - name: Collect APK
        run: cp build/app/outputs/flutter-apk/app-release.apk Ghosst.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TAG="v${APP_VERSION}"
          NOTES="Ghosst **v${APP_VERSION}**"
          NOTES="${NOTES}"$'\n'"Commit: \`${GITHUB_SHA:0:7}\`"
          NOTES="${NOTES}"$'\n'"Build: ${RUN_URL}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of an already-published version — replace the asset.
            gh release upload "$TAG" Ghosst.apk --clobber
          else
            gh release create "$TAG" Ghosst.apk \
              --title "Ghosst v${APP_VERSION}" \
              --notes "$NOTES" \
              --target "$BUMP_SHA" \
              --latest
          fi

      # Auto-open the forced-update gate so every older build blocks at
      # launch and downloads this APK — no manual Admin step.
      # One-time setup: Appwrite API key (documents read/create/delete on the
      # `updates` collection) stored as repo secret APPWRITE_API_KEY.
      # Optional secret UPDATE_URL overrides the download link (e.g. MediaFire).
      - name: Open forced-update gate (Appwrite)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPWRITE_API_KEY: ${{ secrets.APPWRITE_API_KEY }}
          UPDATE_URL: ${{ secrets.UPDATE_URL }}
        run: |
          set -euo pipefail

          if [ -z "$APPWRITE_API_KEY" ]; then
            echo "::notice::APPWRITE_API_KEY not set — skipping the forced-update gate. Add the Appwrite API key as a repo secret to auto-open it on every release (the release above is unaffected)."
            exit 0
          fi

          GATE_URL="${UPDATE_URL:-https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/Ghosst.apk}"
          if [ -z "$UPDATE_URL" ] && [ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq .private)" = "true" ]; then
            echo "::warning::Repo is private — the app can't download the APK from GitHub releases anonymously. Make the repo public or set the UPDATE_URL secret. Gate NOT published."
            exit 0
          fi

          # 1.0.0+4 → name 1.0.0, build 4 (set by the bump step).
          BASE="${APP_VERSION%%+*}"
          BUILD="${APP_VERSION##*+}"

          HEADERS=(-H "X-Appwrite-Project: 6ac4baef0010879da982" -H "X-Appwrite-Key: ${APPWRITE_API_KEY}")
          DOCS="https://sgp.cloud.appwrite.io/v1/databases/ghosst/collections/updates/documents"

          # Retire previous announcements — exactly one active doc should exist.
          IDS=$(curl -sS -f "${HEADERS[@]}" "${DOCS}?limit=100" | jq -r --arg k '$id' '.documents[] | .[$k]')
          for id in $IDS; do
            curl -sS -f "${HEADERS[@]}" -X DELETE "${DOCS}/${id}" > /dev/null
          done

          # Publish this build as the new forced update.
          BODY=$(jq -n \
            --argjson versionCode "$BUILD" \
            --arg versionName "$BASE" \
            --arg url "$GATE_URL" \
            --arg message "Required update — install the latest Ghosst to keep using the app." \
            '{versionCode: $versionCode, versionName: $versionName, url: $url, message: $message, active: true}')
          NEW_ID=$(curl -sS -f "${HEADERS[@]}" -H "Content-Type: application/json" \
            -X POST -d "$BODY" "$DOCS" | jq -r '."$id"')
          echo "Forced-update gate open: build ${BUILD} (${BASE}) → ${GATE_URL} (doc ${NEW_ID})"
