# Builds the Play Store bundle without publishing it. Version name/code come
# directly from pubspec.yaml; Google Play is the only update channel.
name: Build Play Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-play-bundle
  cancel-in-progress: false

jobs:
  build-play:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Quality gate — a failing test stops the bundle build.
      - name: Run tests
        run: flutter test

      - name: Build Play release bundle
        run: flutter build appbundle --release --flavor play

      - name: Upload Play bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ghosst-Play-${{ github.run_number }}
          path: build/app/outputs/bundle/playRelease/app-play-release.aab
