# Builds every Android QA/distribution variant and publishes the raw files to
# one GitHub Release. Live artifacts always force production ad units; QA
# artifacts always force Google's sample test units.
name: Build Android Releases

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-android-releases
  cancel-in-progress: false

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 2.0.0+29 -> 2.0.0+30. The skip marker prevents the bot's version
      # commit from starting a second workflow run.
      - name: Bump build number
        run: |
          set -euo pipefail
          VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          BASE=${VER%%+*}
          BUILD=${VER##*+}
          if [ "$BASE" = "$VER" ]; then BUILD=0; fi
          NEW=$((BUILD + 1))
          sed -i "s/^version: .*/version: ${BASE}+${NEW}/" pubspec.yaml
          echo "APP_VERSION=${BASE}+${NEW}" >> "$GITHUB_ENV"
          echo "ASSET_VERSION=${BASE}-${NEW}" >> "$GITHUB_ENV"
          # QA artifacts get a version code far from the live one so a test-ads
          # APK can never install over the live app, and Play never sees the
          # same code twice.
          echo "QA_BUILD=$((NEW + 500))" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${BASE}+${NEW} [skip ci]"
          for i in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            if [ "$i" = "3" ]; then echo "push failed 3x" >&2; exit 1; fi
            git pull --rebase origin main
            sleep 5
          done
          echo "BUMP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Bumped ${VER} -> ${BASE}+${NEW}"

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Prepare release assets
        run: mkdir -p release-assets

      # Release-mode QA catches optimizer/release-only bugs while still using
      # Google's guaranteed-fill sample IDs. Never publish this APK to users.
      # The +500 version code keeps QA out of the live build's install slot.
      - name: Build release QA APK (test ads)
        run: |
          set -euo pipefail
          flutter build apk --release --flavor play --dart-define=USE_TEST_ADS=true \
            --build-number "$QA_BUILD"
          cp build/app/outputs/flutter-apk/app-play-release.apk \
            "release-assets/ghosst-play-release-test-ads-${ASSET_VERSION}.apk"

      # Closed-testing bundle. Same separated version code as the QA APK.
      - name: Build closed-beta bundle (test ads)
        run: |
          set -euo pipefail
          flutter build appbundle --release --flavor play --dart-define=USE_TEST_ADS=true \
            --build-number "$QA_BUILD"
          cp build/app/outputs/bundle/playRelease/app-play-release.aab \
            "release-assets/ghosst-play-closed-beta-test-ads-${ASSET_VERSION}.aab"

      - name: Build release APK (live ads)
        run: |
          set -euo pipefail
          flutter build apk --release --flavor play --dart-define=USE_TEST_ADS=false
          cp build/app/outputs/flutter-apk/app-play-release.apk \
            "release-assets/ghosst-play-release-live-ads-${ASSET_VERSION}.apk"

      - name: Build Play bundle (live ads)
        run: |
          set -euo pipefail
          flutter build appbundle --release --flavor play --dart-define=USE_TEST_ADS=false
          cp build/app/outputs/bundle/playRelease/app-play-release.aab \
            "release-assets/ghosst-play-live-ads-${ASSET_VERSION}.aab"

      # A wrong --dart-define silently ships test ads (no SSV, no coins) or
      # live ads to beta testers; both bundles must carry their own units.
      # grep -c (not -q) so unzip is never killed by SIGPIPE under pipefail.
      - name: Verify ad units in bundles
        run: |
          set -euo pipefail
          unzip -p "release-assets/ghosst-play-live-ads-${ASSET_VERSION}.aab" \
            | grep -ac 'ca-app-pub-7791552060229072/3206073177' >/dev/null
          unzip -p "release-assets/ghosst-play-closed-beta-test-ads-${ASSET_VERSION}.aab" \
            | grep -ac 'ca-app-pub-3940256099942544/5224354917' >/dev/null

      # Keep a downloadable Actions artifact even if GitHub Release publishing
      # is temporarily unavailable. GitHub wraps this copy in a zip; the files
      # attached to the Release below remain raw APK/AAB assets. The R8 mapping
      # stays here only: publishing it next to the APK would hand out the
      # tamper-check method names.
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghosst-android-${{ env.ASSET_VERSION }}
          path: |
            release-assets/*
            build/app/outputs/mapping/playRelease/mapping.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NOTES="Ghosst **${APP_VERSION}** Android builds"
          NOTES="${NOTES}"$'\n\n'"- **Play AAB / live-ads APK:** production AdMob IDs + Apps/APK shelf"
          NOTES="${NOTES}"$'\n'"- **closed-beta-test-ads AAB:** test ads + Apps/APK shelf; do not promote to production"
          NOTES="${NOTES}"$'\n'"- **release-test-ads APK:** release-mode QA with Google sample ads; do not distribute"
          NOTES="${NOTES}"$'\n'"- Live builds use version code ${APP_VERSION##*+}; QA builds use ${QA_BUILD}. Play cannot reuse a version code"
          NOTES="${NOTES}"$'\n\n'"Source commit: \`${GITHUB_SHA:0:7}\`"
          NOTES="${NOTES}"$'\n'"Workflow: ${RUN_URL}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Ghosst v${APP_VERSION}" \
              --notes "$NOTES" \
              --target "$BUMP_SHA" \
              --latest
          fi
          echo "Published ${TAG} with live and test-ad builds"
