# Builds the Play Store bundle and attaches the raw .aab to a GitHub Release.
# Every push to main auto-bumps the build number (+N) first, so each build
# publishes a NEW tag/release. Version name (x.y.z) comes from pubspec.yaml;
# Google Play is the only update channel. Release assets are stored as-is
# (no zip wrapper).
name: Build Play Bundle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # create the release and upload the .aab asset

concurrency:
  group: build-play-bundle
  cancel-in-progress: false

jobs:
  build-play:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 1.0.0+25 → 1.0.0+26 (x.y.z is bumped by hand, +N is CI's).
      # The [skip ci] tag keeps this commit from triggering another build.
      - name: Bump build number
        run: |
          set -euo pipefail
          VER=$(grep -E '^version:' pubspec.yaml | awk '{print $2}')
          BASE=${VER%%+*}
          BUILD=${VER##*+}
          if [ "$BASE" = "$VER" ]; then BUILD=0; fi
          NEW=$((BUILD + 1))
          sed -i "s/^version: .*/version: ${BASE}+${NEW}/" pubspec.yaml
          echo "APP_VERSION=${BASE}+${NEW}" >> "$GITHUB_ENV"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to ${BASE}+${NEW} [skip ci]"
          for i in 1 2 3; do
            if git push origin HEAD:main; then break; fi
            if [ "$i" = "3" ]; then echo "push failed 3x" >&2; exit 1; fi
            git pull --rebase origin main
            sleep 5
          done
          echo "BUMP_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Bumped ${VER} → ${BASE}+${NEW}"

      # Quality gate — a failing test stops the bundle build (and the bump
      # commit above already landed, so a retry just bumps again).
      - name: Run tests
        run: flutter test

      - name: Build Play release bundle
        run: flutter build appbundle --release --flavor play

      # The .aab is attached directly as a release asset — GitHub artifacts
      # are always zipped, releases are not.
      - name: Publish release with raw .aab
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VER="${APP_VERSION}"
          TAG="v${VER}"
          AAB=build/app/outputs/bundle/playRelease/app-play-release.aab
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          NOTES="Ghosst **${VER}** — Play bundle (\`.aab\`)"
          NOTES="${NOTES}"$'\n'"Commit: \`${GITHUB_SHA:0:7}\`"
          NOTES="${NOTES}"$'\n'"Build: ${RUN_URL}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            # Re-run of an already-published version — replace the asset.
            gh release upload "$TAG" "$AAB" --clobber
          else
            gh release create "$TAG" "$AAB" \
              --title "Ghosst v${VER}" \
              --notes "$NOTES" \
              --target "$BUMP_SHA" \
              --latest
          fi
          echo "Published ${TAG} → app-play-release.aab"
