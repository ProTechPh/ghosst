# The machine this builds on (and GitHub's 7 GB runners) can't back an 8 GB
# heap — R8 on release builds pushed the daemon into native OOM. Keep it modest.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Pub cache (C:) and project (D:) on different Windows drives breaks Kotlin
# incremental compilation for plugin sources - disable it.
kotlin.incremental=false
